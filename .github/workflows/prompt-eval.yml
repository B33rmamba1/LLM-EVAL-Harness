name: prompt-security-eval

# Ships the guardrail check with every change: unit tests always run, and the
# attack suite runs against a model when credentials are configured. The job
# fails (blocking merge) if the pass rate drops below the threshold.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) Scorer unit tests (no model needed, no third-party deps).
      - name: Run scorer unit tests
        run: python3 test_prompt_eval.py

      # 2) Offline smoke test of the full harness against the mock provider.
      #    threshold 0.0 so the intentionally-vulnerable demo case doesn't fail CI here.
      - name: Harness smoke test (mock provider)
        run: python3 prompt_eval.py --provider mock --threshold 0.0 --out results-mock.json

      # 3) Real evaluation against a model. Requires OPENAI_API_KEY (and optionally
      #    a self-hosted base URL) in repo/environment secrets. Gate at 100% by default.
      - name: Evaluate target model
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 prompt_eval.py \
            --provider openai \
            --base-url "${LLM_BASE_URL:-https://api.openai.com/v1}" \
            --model "${LLM_MODEL:-gpt-4o-mini}" \
            --threshold 1.0 \
            --out results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results*.json
