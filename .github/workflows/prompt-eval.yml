name: prompt-security-eval

# Ships the guardrail check with every change: unit tests and an offline smoke
# test always run; the attack suite runs against a real model when credentials
# are configured. The job fails (blocking merge) if the pass rate drops below
# the threshold.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    # Job-level env so the secret is readable in step `if:` conditions.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) Scorer unit tests (no model, no third-party deps).
      - name: Run scorer unit tests
        run: python3 test_prompt_eval.py

      # 2) Offline smoke test of the full harness against the mock provider.
      #    threshold 0.0 because the suite intentionally includes vulnerable
      #    demo cases; this step only proves the harness runs end to end.
      - name: Harness smoke test (mock provider)
        run: python3 prompt_eval.py --provider mock --threshold 0.0 --out results-mock.json

      # 3) Real evaluation. Runs only when OPENAI_API_KEY is configured as a
      #    repo secret. Gated at 100% by default so any regression fails CI.
      - name: Evaluate target model
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python3 prompt_eval.py \
            --provider openai \
            --base-url "${LLM_BASE_URL:-https://api.openai.com/v1}" \
            --model "${LLM_MODEL:-gpt-4o-mini}" \
            --threshold 1.0 \
            --out results-live.json

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results-*.json
          if-no-files-found: ignore
